name: Godot smoke tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import and parse project
        run: godot --headless --editor --path . --import --quit
      - name: Run parameter and undo smoke tests
        run: godot --headless --path . --script res://tests/test_parameter_system.gd
