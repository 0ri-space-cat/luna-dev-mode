name: Godot smoke tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate prepared art paths and canonical IDs
        run: python3 ci/validate_prepared_assets.py
      - name: Install Godot 4.3 with mirrors
        run: |
          set -euo pipefail
          for source in \
            "https://downloads.godotengine.org/?version=4.3&flavor=stable&platform=linux.64&slug=linux.x86_64.zip" \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"; do
            echo "Trying a Godot 4.3 mirror"
            if curl -fL --connect-timeout 15 --max-time 70 --retry 1 --retry-all-errors \
              -o /tmp/godot.zip "$source" && unzip -tq /tmp/godot.zip >/dev/null; then
              break
            fi
            rm -f /tmp/godot.zip
          done
          test -s /tmp/godot.zip || (echo "::error::Godot downloads unavailable" && exit 1)
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --headless --version
      - name: Import and parse project
        run: godot --headless --editor --path . --import --quit
      - name: Run asset registry and UI foundation tests
        run: bash ci/run_godot_script.sh res://tests/test_asset_ui_foundation.gd
      - name: Boot actual main scene headlessly
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 8 2>&1 | tee /tmp/luna-boot.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call' /tmp/luna-boot.log; then
            echo "Godot reported a runtime or parser error."
            exit 1
          fi
          # Godot 4.3's headless dummy renderer sometimes reports a null
          # mesh when it has no rendering backend; flag every other ERROR.
          if grep '^ERROR:' /tmp/luna-boot.log | grep -Fv 'ERROR: Parameter "m" is null.'; then
            echo "Unexpected Godot engine error during main-scene boot."
            exit 1
          fi
      - name: Run parameter and undo smoke tests
        run: bash ci/run_godot_script.sh res://tests/test_parameter_system.gd
      - name: Run behavior and targeting smoke tests
        run: bash ci/run_godot_script.sh res://tests/test_behavior_system.gd
      - name: Run effects and rules smoke tests
        run: bash ci/run_godot_script.sh res://tests/test_rule_system.gd

      - name: Run advanced rule grammar and persistence tests
        run: bash ci/run_godot_script.sh res://tests/test_advanced_rules.gd

      - name: Run composable entity role and tag tests
        run: bash ci/run_godot_script.sh res://tests/test_entity_traits.gd

      - name: Run reversible role/tag commands and reactive rule tests
        run: bash ci/run_godot_script.sh res://tests/test_trait_commands.gd

      - name: Run entity lifecycle and deletion persistence tests
        run: bash ci/run_godot_script.sh res://tests/test_entity_lifecycle.gd

      - name: Run atomic world and lifecycle effects tests
        run: bash ci/run_godot_script.sh res://tests/test_world_transactions.gd

      - name: Run bounded role/tag/relationship selector integration tests
        run: bash ci/run_godot_script.sh res://tests/test_target_selectors.gd

      - name: Run composable entity component and checkpoint tests
        run: bash ci/run_godot_script.sh res://tests/test_entity_components.gd

      - name: Run interaction and trigger zone tests
        run: bash ci/run_godot_script.sh res://tests/test_interaction_zones.gd

      - name: Run portable ability component tests
        run: bash ci/run_godot_script.sh res://tests/test_abilities.gd

      - name: Run stable ID history recreation tests
        run: bash ci/run_godot_script.sh res://tests/test_history_recreation.gd

      - name: Run failure-injected save rollback tests
        run: bash ci/run_godot_script.sh res://tests/test_save_rollback.gd

      - name: Run entity inventory and portable item tests
        run: bash ci/run_godot_script.sh res://tests/test_inventory.gd
      - name: Run save and load smoke tests
        run: bash ci/run_godot_script.sh res://tests/test_save_service.gd
      - name: Run social relations smoke tests
        run: bash ci/run_godot_script.sh res://tests/test_relationships.gd
      - name: Run discovery profile smoke tests
        run: bash ci/run_godot_script.sh res://tests/test_profile_service.gd
      - name: Run spell engine smoke tests
        run: bash ci/run_godot_script.sh res://tests/test_spell_service.gd
      - name: Run full scene integration tests
        run: bash ci/run_godot_script.sh res://tests/test_main_integration.gd

      - name: Run 0.18 bilingual inspector and copy persistence tests
        run: bash ci/run_godot_script.sh res://tests/test_editor_ux.gd

      - name: Run atomic effect transaction tests
        run: bash ci/run_godot_script.sh res://tests/test_atomic_effects.gd

      - name: Run spell workshop and persistence tests
        run: bash ci/run_godot_script.sh res://tests/test_spell_workshop.gd

      - name: Run elemental spell and projectile tests
        run: bash ci/run_godot_script.sh res://tests/test_arcane_magic.gd

      - name: Run CREATE OBJECT CREATURE magic tests
        run: bash ci/run_godot_script.sh res://tests/test_create_magic.gd

      - name: Run legacy magic recipe migration tests
        run: bash ci/run_godot_script.sh res://tests/test_legacy_magic_migration.gd

      - name: Run spatial ON_HIT burst tests
        run: bash ci/run_godot_script.sh res://tests/test_area_effects.gd

      - name: Run elemental status and interaction tests
        run: bash ci/run_godot_script.sh res://tests/test_elemental_status.gd

      - name: Run chain lightning hop and transactional tests
        run: bash ci/run_godot_script.sh res://tests/test_chain_lightning.gd

      - name: Run material, fire propagation and ice terrain tests
        run: bash ci/run_godot_script.sh res://tests/test_environment_interactions.gd

      - name: Run fire thaw and temporary ice interaction tests
        run: bash ci/run_godot_script.sh res://tests/test_fire_melts_ice.gd

      - name: Run steam clouds, visibility and living fire avoidance tests
        run: bash ci/run_godot_script.sh res://tests/test_steam_and_fire_ai.gd

      - name: Run social witness reactions and temporary memory tests
        run: bash ci/run_godot_script.sh res://tests/test_social_awareness.gd

      - name: Verify two-tier magical access and Oracle Eye
        run: bash ci/run_godot_script.sh res://tests/test_2d_access_policy.gd

      - name: Verify playable 2D meadow and independent saves
        run: bash ci/run_godot_script.sh res://tests/test_meadow_2d.gd

      - name: Boot 2D scene explicitly (also configured as startup on this branch)
        run: |
          set -o pipefail
          godot --headless --path . res://scenes/2d/world_2d.tscn --quit-after 20 2>&1 | tee /tmp/luna-meadow-2d.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|^ERROR:' /tmp/luna-meadow-2d.log; then
            echo "Godot 2D scene did not boot cleanly."
            exit 1
          fi


      - name: Render GUI preview in virtual display
        continue-on-error: true
        run: |
          mkdir -p /tmp/luna-preview
          xvfb-run -a godot --path . --rendering-driver opengl3 \
            --script res://tests/capture_meadow_2d.gd
          find "$HOME/.local/share/godot/app_userdata" -name eternia_preview.png \
            -exec cp '{}' /tmp/luna-preview/meadow.png \;
          find "$HOME/.local/share/godot/app_userdata" -name eternia_editor_preview.png \
            -exec cp '{}' /tmp/luna-preview/editor.png \;

      - name: Upload Godot screenshot for visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eternia-2d-preview
          path: /tmp/luna-preview/*.png
          if-no-files-found: warn

  asset-importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install Pillow
      - name: Validate asset slicing and seam rejection
        run: python3 -m unittest tools.test_asset_importer -v
      - name: Validate 12 illustrated terrain textures and 6 transparent props
        run: python3 ci/check_terrain_seams.py
