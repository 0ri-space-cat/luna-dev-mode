name: Godot smoke tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          curl -fL --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import and parse project
        run: godot --headless --editor --path . --import --quit
      - name: Boot actual main scene headlessly
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 8 2>&1 | tee /tmp/luna-boot.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call' /tmp/luna-boot.log; then
            echo "Godot reported a runtime or parser error."
            exit 1
          fi
      - name: Run parameter and undo smoke tests
        run: timeout 40s godot --headless --path . --script res://tests/test_parameter_system.gd
      - name: Run behavior and targeting smoke tests
        run: timeout 40s godot --headless --path . --script res://tests/test_behavior_system.gd
      - name: Run effects and rules smoke tests
        run: timeout 40s godot --headless --path . --script res://tests/test_rule_system.gd
      - name: Run save and load smoke tests
        run: timeout 40s godot --headless --path . --script res://tests/test_save_service.gd
      - name: Run social relations smoke tests
        run: timeout 40s godot --headless --path . --script res://tests/test_relationships.gd
      - name: Run discovery profile smoke tests
        run: timeout 40s godot --headless --path . --script res://tests/test_profile_service.gd
      - name: Run spell engine smoke tests
        run: timeout 40s godot --headless --path . --script res://tests/test_spell_service.gd
      - name: Run full scene integration tests
        run: timeout 40s godot --headless --path . --script res://tests/test_main_integration.gd

      - name: Run atomic effect transaction tests
        run: timeout 40s godot --headless --path . --script res://tests/test_atomic_effects.gd

      - name: Run spell workshop and persistence tests
        run: timeout 40s godot --headless --path . --script res://tests/test_spell_workshop.gd

      - name: Run elemental spell and projectile tests
        run: timeout 40s godot --headless --path . --script res://tests/test_arcane_magic.gd

      - name: Run CREATE OBJECT CREATURE magic tests
        run: timeout 40s godot --headless --path . --script res://tests/test_create_magic.gd
