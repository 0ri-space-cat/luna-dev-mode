name: LUNA Runtime2D smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  runtime2d:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.3-stable_linux.x86_64
          sudo mv /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Parse project and new 2D scripts
        run: |
          set -o pipefail
          godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/luna-2d-parse.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|^ERROR:' /tmp/luna-2d-parse.log; then
            exit 1
          fi
      - name: Test new skeleton elevation, supports and recovery
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_elevation.gd
      - name: Test skeleton mass, impulse and restitution
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_impulse.gd
      - name: Test skeleton water, buoyancy and swimming
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_water.gd
      - name: Test skeleton boarding, load and dismount
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_riding.gd
      - name: Test skeleton entities and physical wand edits
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_entities.gd
      - name: Test skeleton life and sleep
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_life.gd
      - name: Test skeleton multiple entity control
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_control.gd
      - name: Test skeleton size and movement speed
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_size_speed.gd
      - name: Test skeleton six-tab editor and behaviour
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_editor.gd
      - name: Test skeleton individual gravity
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_gravity.gd
      - name: Test the start island and repeatable rift
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_start_island.gd
      - name: Test the meadows routes and thawing creek
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_meadows.gd
      - name: Test the starter world clock, camp and timed effects
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_world_time.gd
      - name: Test the finite ability instance and bank access
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_ability_bank.gd
      - name: Test an authored rule in the 2D+Z skeleton
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_world_rule.gd
      - name: Test camera and gaze-dependent height supports
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_observation.gd
      - name: Test addressed height rooms and safe arrival
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_address.gd
      - name: Test overlapping wand fields and underside supports
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_underside.gd
      - name: Test the 2D+Z exterior and interior projection sample
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_art_probe.gd
      - name: Test loading-frame travel and Black Void recovery
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_outer_routes.gd
      - name: Test voluntary ghost rides, house address and the distant record
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_void_exploration.gd
      - name: Test the integrated island, wand reset and Black Void recovery
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_administrator.gd
      - name: Test Administrator stasis, active cooldown and durable surrender
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_administrator_stasis.gd
      - name: Test ecology across actual fauna, the ability bank and saved interventions
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_ecology.gd
      - name: Test rare observations, exact bank report and saved delivery
        run: bash ci/run_godot_script.sh res://tests/test_skeleton_administrator_observations.gd
      - name: Test 2D runtime contracts
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_foundation.gd
      - name: Test authored geometry, physical abilities and world laws
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_world_laws.gd
      - name: Test AI behavior and approved ability adapters
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_behavior_abilities.gd
      - name: Test authored doors and atomic checkpoint validation
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_authoring_contract.gd
      - name: Test guarded world timeline and rewind
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_timeline.gd
      - name: Test wand editing authorization without HUD
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_wand_policy.gd
      - name: Test authored A-star navigation and physical detours
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_navigation.gd
      - name: Test physical CLIMB passages and mixed traversal routes
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_climb.gd
      - name: Test symmetric local actor avoidance and room isolation
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_avoidance.gd
      - name: Test author-defined world rules and one-shot persistence
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_world_rules.gd
      - name: Test daily time windows, world time modes and unscaled safety
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_time_modes.gd
      - name: Test real event-overflow recovery and safe checkpoints
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_recovery.gd
      - name: Test dynamic gaze-dependent physical navigation
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_dynamic_observation_nav.gd
      - name: Test physical RIDEABLE carrier and passenger persistence
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_riding.gd
      - name: Test P0 map preflight and verified save backups
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_storage_integrity.gd
      - name: Test P1 physical PICKUP carry and drop contracts
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_physical_pickup.gd
      - name: Test P1 bounded physical pushing and wall collision
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_push.gd
      - name: Test P1 multi-zone and parameter rule predicates
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_rule_conditions.gd
      - name: Test atomic multi-object physical push and Undo history
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_push_history.gd
      - name: Test protected atomic spell program command bundles
        run: bash ci/run_godot_script.sh res://tests/test_runtime2d_spell_program.gd
      - name: Test playable Eternia campaign
        run: bash ci/run_godot_script.sh res://tests/test_eternia_adventure.gd
      - name: Boot 2D main scene
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 8 2>&1 | tee /tmp/runtime2d-boot.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|^ERROR:' /tmp/runtime2d-boot.log; then
            exit 1
          fi
