<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Юки — проба интерфейса</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#211a2a;color:#fff1f8}header{padding:16px 24px;background:#211a2a;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:18px;margin:0 auto 0 0}button{border:1px solid #eeb1d0;background:#6e3f60;color:white;padding:8px 12px;cursor:pointer;border-radius:4px}p{margin:0;font-size:13px;color:#f2dce8}.scene{min-height:calc(100vh - 70px);padding:28px;background:#474053;display:flex;gap:30px;align-items:flex-start;justify-content:center;flex-wrap:wrap}.scene.light{background:#c5ceb8}.bag{width:290px;position:relative}.bag>img{display:block;width:100%}.slots{position:absolute;left:27%;top:40.8%;width:46%;height:46%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px}.slot{background:rgba(82,43,70,.50);border:2px solid #e6b2cd;clip-path:polygon(10% 0,90% 0,100% 10%,100% 90%,90% 100%,10% 100%,0 90%,0 10%)}.slot.active{border-color:#fff1fa;box-shadow:inset 0 0 7px #f68abe;background:rgba(192,91,145,.5)}.column{width:min(650px,100%)}.panel{position:relative;width:100%}.panel>img{width:100%;display:block}.content{position:absolute;inset:16% 7%;color:#fff4fa;text-shadow:0 1px #6f405e}.content h2{font-size:18px;margin:0 0 10px}.content div{font-size:14px;margin:6px 0}.content span{color:#bde4de}.cursor{width:54px;position:absolute;right:18%;bottom:14%;filter:none}.hint{padding:12px 6px;color:inherit;font-size:13px;max-width:600px}.scene.light .hint{color:#39253a}@media(max-width:600px){.content h2{font-size:14px}.content div{font-size:11px;margin:2px 0}.scene{padding:12px;gap:5px}}
</style></head><body><header><h1>Юки · проверка палитры</h1><button id="toggle">Сменить фон</button><p>Проба сочетания цветов, не игровой экран</p></header><main class="scene" id="scene"><div class="bag"><img src="../../assets/ui-pixel-v1/party-a/yuki-backpack-balanced-source.png" alt="Рюкзак Юки"><div class="slots"><div class="slot active"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div></div></div><div class="column"><div class="panel"><img src="../../assets/ui-pixel-v1/party-a/yuki-console-balanced-study.png" alt="Панель Юки"><div class="content"><h2>КОНСОЛЬ ЮКИ</h2><div>Событие: <span>выбран объект</span></div><div>Условие: <span>доступно</span></div><div>Действие: <span>изменить параметр</span></div></div><img class="cursor" src="../../assets/ui-pixel-v1/cursors/yuki-source.png" alt="Курсор Юки"></div><div class="hint">Пример текста и девять условных ячеек добавлены для проверки читаемости. Переключите фон, чтобы оценить сочетание цветов.</div></div></main><script>document.getElementById('toggle').onclick=()=>document.getElementById('scene').classList.toggle('light');</script></body></html>
